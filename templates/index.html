<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makarna AI</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍝</text></svg>">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
</head>
<body>
    <!-- Giris Ekrani -->
    <div id="giris-ekrani" class="giris-ekrani">
        <div class="giris-kutu">
            <div class="giris-logo">🍝</div>
            <h1 class="giris-baslik">Makarna AI</h1>
            <p class="giris-aciklama">Krema'nin sahte yapay zekasi</p>
            <input type="text" id="kullanici-adi" class="giris-input" placeholder="Adin ne?" maxlength="20">
            <button id="giris-btn" class="giris-btn">Gir 🍝</button>
        </div>
    </div>

    <!-- Chat Ekrani -->
    <div id="chat-ekrani" class="chat-ekrani" style="display:none;">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-baslik">
                <span>🍝</span>
                <span>Makarna AI</span>
            </div>
            <button id="yeni-sohbet-btn" class="yeni-sohbet-btn">+ Yeni Sohbet</button>
            <div id="sohbet-listesi" class="sohbet-listesi"></div>
            <div class="sidebar-alt">
                <span id="kullanici-avatar" class="avatar">👤</span>
                <span id="kullanici-goster">Misafir</span>
            </div>
        </div>

        <div class="chat-alani">
            <div class="chat-baslik">
                <span id="chat-baslik-metin">Sohbet Sec</span>
                <span id="chat-durum">🟢</span>
            </div>

            <div id="mesaj-alani" class="mesaj-alani">
                <div class="hosgeldin-mesaji">
                    <div class="hosgeldin-emoji">🍝</div>
                    <h2>Hos geldin!</h2>
                    <p>Sol taraftan yeni sohbet baslat</p>
                </div>
            </div>

            <div id="mesaj-giris" class="mesaj-giris" style="display:none;">
                <div class="mesaj-input-kutu">
                    <input type="text" id="mesaj-input" class="mesaj-input" placeholder="Bir sey yaz..." maxlength="500">
                    <button id="gonder-btn" class="gonder-btn">Gonder</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        var socket = io();
        var kullaniciAdi = '';
        var aktifOda = null;
        var sohbetler = {};

        // Giris
        document.getElementById('giris-btn').onclick = function() {
            var input = document.getElementById('kullanici-adi');
            kullaniciAdi = input.value.trim();
            if (!kullaniciAdi) {
                input.style.borderColor = 'red';
                return;
            }
            document.getElementById('giris-ekrani').style.display = 'none';
            document.getElementById('chat-ekrani').style.display = 'flex';
            document.getElementById('kullanici-goster').textContent = kullaniciAdi;
            document.getElementById('kullanici-avatar').textContent = kullaniciAdi.charAt(0).toUpperCase();
            yeniSohbet();
        };

        document.getElementById('kullanici-adi').onkeypress = function(e) {
            if (e.key === 'Enter') document.getElementById('giris-btn').click();
        };

        // Yeni Sohbet
        document.getElementById('yeni-sohbet-btn').onclick = function() {
            yeniSohbet();
        };

        function yeniSohbet() {
            console.log('Yeni sohbet isteniyor...');
            socket.emit('yeni_sohbet', { kullanici: kullaniciAdi });
        }

        socket.on('sohbet_olusturuldu', function(data) {
            console.log('Sohbet olusturuldu:', data);
            var room_id = data.room_id;

            sohbetler[room_id] = {
                adi: 'Sohbet ' + (Object.keys(sohbetler).length + 1),
                mesajlar: []
            };

            // Listeyi guncelle
            var liste = document.getElementById('sohbet-listesi');
            liste.innerHTML = '';
            var keys = Object.keys(sohbetler);
            for (var i = 0; i < keys.length; i++) {
                var rid = keys[i];
                var div = document.createElement('div');
                div.className = 'sohbet-item' + (rid === room_id ? ' aktif' : '');
                div.setAttribute('data-room-id', rid);
                div.textContent = sohbetler[rid].adi;
                div.onclick = (function(id) {
                    return function() { odaSec(id); };
                })(rid);
                liste.appendChild(div);
            }

            odaSec(room_id);
        });

        function odaSec(room_id) {
            aktifOda = room_id;
            var sohbet = sohbetler[room_id];

            document.getElementById('chat-baslik-metin').textContent = sohbet ? sohbet.adi : 'Sohbet';
            document.getElementById('mesaj-alani').innerHTML = '';
            document.getElementById('mesaj-giris').style.display = 'block';

            if (sohbet.mesajlar.length > 0) {
                for (var j = 0; j < sohbet.mesajlar.length; j++) {
                    mesajEkle(sohbet.mesajlar[j], false);
                }
            }

            document.getElementById('mesaj-input').focus();
        }

        // Mesaj Gonder
        document.getElementById('gonder-btn').onclick = function() {
            mesajGonder();
        };

        document.getElementById('mesaj-input').onkeypress = function(e) {
            if (e.key === 'Enter') mesajGonder();
        };

        function mesajGonder() {
            var input = document.getElementById('mesaj-input');
            var mesaj = input.value.trim();
            if (!mesaj || !aktifOda) return;

            socket.emit('kullanici_mesaj', {
                room_id: aktifOda,
                kullanici: kullaniciAdi,
                mesaj: mesaj
            });

            input.value = '';
        }

        // Mesaj Geldi
        socket.on('mesaj_geldi', function(data) {
            console.log('Mesaj geldi:', data);
            if (aktifOda && sohbetler[aktifOda]) {
                sohbetler[aktifOda].mesajlar.push(data);
            }
            mesajEkle(data, true);
        });

        function mesajEkle(data, scroll) {
            var alan = document.getElementById('mesaj-alani');

            // Hosgeldin mesajini kaldir
            var hosgeldin = alan.querySelector('.hosgeldin-mesaji');
            if (hosgeldin) hosgeldin.remove();

            var div = document.createElement('div');
            var benim = data.gonderen === 'kullanici';
            div.className = 'mesaj ' + (benim ? 'benim' : 'bot');

            var avatar = benim ? kullaniciAdi.charAt(0).toUpperCase() : '🍝';

            div.innerHTML = '<div class="mesaj-avatar">' + avatar + '</div>' +
                '<div class="mesaj-icerik">' +
                '<div class="mesaj-baslik">' +
                '<span class="mesaj-sahip">' + data.kullanici + '</span>' +
                '<span class="mesaj-saat">' + data.saat + '</span>' +
                '</div>' +
                '<div class="mesaj-metin">' + data.mesaj + '</div>' +
                '</div>';

            alan.appendChild(div);

            if (scroll !== false) {
                alan.scrollTop = alan.scrollHeight;
            }
        }

        // Baglanti
        socket.on('connect', function() {
            console.log('Baglandi!');
        });

        socket.on('disconnect', function() {
            console.log('Kesildi!');
        });

        socket.on('connect_error', function(err) {
            console.log('Hata:', err.message);
        });
    </script>
</body>
</html>
