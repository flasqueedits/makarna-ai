<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makarna AI - Admin</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍝</text></svg>">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
</head>
<body class="admin-body">
    <div class="admin-container">
        <div class="admin-sidebar">
            <div class="admin-sidebar-baslik">
                <span>🍝</span>
                <span>Admin</span>
            </div>

            <div class="admin-kontrol">
                <button id="bot-durum-btn" class="bot-durum-btn aktif">
                    BOT: AKTIF
                </button>
            </div>

            <div class="admin-global">
                <h3>Global Duyuru</h3>
                <div class="admin-global-input">
                    <input type="text" id="global-mesaj-input" class="admin-input" placeholder="Tum kullanicilara...">
                    <button id="global-gonder-btn" class="admin-gonder-btn global">Gonder</button>
                </div>
            </div>

            <div class="admin-odalar">
                <h3>Aktif Odalar (<span id="toplam-oda">0</span>)</h3>
                <div id="oda-listesi" class="oda-listesi">
                    <div class="oda-yok">Henuz oda yok</div>
                </div>
            </div>
        </div>

        <div class="admin-chat-alani">
            <div class="admin-chat-baslik">
                <span id="admin-chat-baslik">Oda Sec</span>
                <span id="admin-chat-durum"></span>
            </div>

            <div id="admin-mesaj-alani" class="admin-mesaj-alani">
                <div class="admin-hosgeldin">
                    <div class="admin-hosgeldin-emoji">🔧</div>
                    <h2>Admin Panel</h2>
                    <p>Sol taraftan oda sec veya duyuru gonder</p>
                </div>
            </div>

            <div id="admin-mesaj-giris" class="admin-mesaj-giris" style="display:none;">
                <div class="admin-mesaj-uyari" id="admin-uyari" style="display:none;">
                    Bot aktifken mesaj gonderemezsin!
                </div>
                <div class="admin-mesaj-input-kutu">
                    <input type="text" id="admin-mesaj-input" class="admin-mesaj-input" placeholder="Makarna AI olarak yaz...">
                    <button id="admin-gonder-btn" class="admin-gonder-btn">Gonder</button>
                </div>
            </div>
        </div>
    </div>

    <div id="bildirimler" class="bildirimler"></div>

    <script>
        var socket = io();
        var botAktif = true;
        var seciliOda = null;
        var odaMesajlari = {};

        // Admin odaya katil
        socket.emit('join_admin');

        // Bot durum
        document.getElementById('bot-durum-btn').onclick = function() {
            botAktif = !botAktif;
            socket.emit('bot_durum_degistir', { aktif: botAktif });
            var btn = document.getElementById('bot-durum-btn');
            if (botAktif) {
                btn.textContent = 'BOT: AKTIF';
                btn.className = 'bot-durum-btn aktif';
            } else {
                btn.textContent = 'BOT: KAPALI';
                btn.className = 'bot-durum-btn kapali';
            }
        };

        // Global mesaj
        document.getElementById('global-gonder-btn').onclick = function() {
            var input = document.getElementById('global-mesaj-input');
            var mesaj = input.value.trim();
            if (!mesaj) return;
            socket.emit('global_mesaj', { mesaj: mesaj });
            input.value = '';
            bildirimGoster('Global mesaj gonderildi!');
        };

        document.getElementById('global-mesaj-input').onkeypress = function(e) {
            if (e.key === 'Enter') document.getElementById('global-gonder-btn').click();
        };

        // Admin mesaj
        document.getElementById('admin-gonder-btn').onclick = function() {
            if (botAktif) {
                document.getElementById('admin-uyari').style.display = 'block';
                setTimeout(function() { document.getElementById('admin-uyari').style.display = 'none'; }, 3000);
                return;
            }
            if (!seciliOda) {
                bildirimGoster('Oda sec!');
                return;
            }
            var input = document.getElementById('admin-mesaj-input');
            var mesaj = input.value.trim();
            if (!mesaj) return;
            socket.emit('admin_mesaj_gonder', { room_id: seciliOda, mesaj: mesaj });
            input.value = '';
        };

        document.getElementById('admin-mesaj-input').onkeypress = function(e) {
            if (e.key === 'Enter') document.getElementById('admin-gonder-btn').click();
        };

        // Yeni sohbet
        socket.on('yeni_sohbet_bildirimi', function(data) {
            bildirimGoster(data.kullanici + ' yeni sohbet basladi');
            odaEkle(data.room_id, data.kullanici);
        });

        function odaEkle(room_id, kullanici) {
            if (odaMesajlari[room_id]) return;
            odaMesajlari[room_id] = [];

            var liste = document.getElementById('oda-listesi');
            liste.innerHTML = '';

            var keys = Object.keys(odaMesajlari);
            for (var i = 0; i < keys.length; i++) {
                var rid = keys[i];
                var div = document.createElement('div');
                div.className = 'oda-item' + (rid === seciliOda ? ' aktif' : '');
                div.setAttribute('data-room-id', rid);
                div.textContent = rid;
                div.onclick = (function(id) {
                    return function() { odaSec(id); };
                })(rid);
                liste.appendChild(div);
            }

            document.getElementById('toplam-oda').textContent = keys.length;
        }

        function odaSec(room_id) {
            seciliOda = room_id;

            var items = document.querySelectorAll('.oda-item');
            for (var i = 0; i < items.length; i++) {
                if (items[i].getAttribute('data-room-id') === room_id) {
                    items[i].classList.add('aktif');
                } else {
                    items[i].classList.remove('aktif');
                }
            }

            document.getElementById('admin-mesaj-alani').innerHTML = '';
            document.getElementById('admin-mesaj-giris').style.display = 'block';
            document.getElementById('admin-chat-baslik').textContent = 'Oda: ' + room_id;

            var mesajlar = odaMesajlari[room_id] || [];
            for (var j = 0; j < mesajlar.length; j++) {
                adminMesajEkle(mesajlar[j]);
            }
        }

        socket.on('admin_mesaj_geldi', function(data) {
            if (!odaMesajlari[data.room_id]) {
                odaEkle(data.room_id, data.kullanici);
            }
            odaMesajlari[data.room_id].push(data);

            if (data.room_id === seciliOda) {
                adminMesajEkle(data);
            }
        });

        function adminMesajEkle(data) {
            var alan = document.getElementById('admin-mesaj-alani');
            var div = document.createElement('div');
            var bot = data.gonderen === 'makarna_ai';
            div.className = 'admin-mesaj ' + (bot ? 'bot' : 'kullanici');

            var avatar = bot ? '🍝' : data.kullanici.charAt(0).toUpperCase();

            div.innerHTML = '<div class="admin-mesaj-avatar">' + avatar + '</div>' +
                '<div class="admin-mesaj-icerik">' +
                '<div class="admin-mesaj-baslik">' +
                '<span class="admin-mesaj-sahip">' + data.kullanici + '</span>' +
                '<span class="admin-mesaj-saat">' + data.saat + '</span>' +
                '</div>' +
                '<div class="admin-mesaj-metin">' + data.mesaj + '</div>' +
                '</div>';

            alan.appendChild(div);
            alan.scrollTop = alan.scrollHeight;
        }

        socket.on('bot_durum_guncelle', function(data) {
            botAktif = data.aktif;
        });

        socket.on('admin_baglandi', function(data) {
            var odalar = data.aktif_odalar || {};
            var keys = Object.keys(odalar);
            for (var i = 0; i < keys.length; i++) {
                odaEkle(keys[i], odalar[keys[i]].kullanici);
            }
        });

        function bildirimGoster(mesaj) {
            var div = document.createElement('div');
            div.className = 'bildirim info';
            div.innerHTML = '<span>' + mesaj + '</span><button onclick="this.parentElement.remove()">X</button>';
            document.getElementById('bildirimler').appendChild(div);
            setTimeout(function() { if (div.parentNode) div.remove(); }, 5000);
        }

        socket.on('kullanici_cikti', function(data) {
            bildirimGoster(data.kullanici + ' cikti');
        });
    </script>
</body>
</html>
